name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download dependencies
        run: make deps

      - name: Verify go.mod/go.sum are tidy
        run: make tidy-check

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: go test (race)
        run: make test-race

      - name: Verify generated mocks are up to date
        run: |
          go install github.com/vektra/mockery/v2@v2.53.6
          make mockery
          git diff --exit-code -- test/mock

      - name: Test coverage
        run: |
          go install github.com/vladopajic/go-test-coverage/v2@v2.19.0
          make gotestcoverage
