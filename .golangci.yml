version: "2"

linters:
  default: standard
  enable:
    - unconvert
    - unparam
    - misspell
    - gocritic
    - revive
    - errorlint
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # this is a multi-package library; not every exported symbol needs a doc comment yet

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
